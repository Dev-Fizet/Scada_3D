<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCADA NATS - Taller OT</title>
<style>
:root{--bg:#07111f;--panel:#101c2e;--line:#263852;--text:#edf5ff;--muted:#95a8c0;--cyan:#38bdf8;--green:#34d399;--amber:#fbbf24;--red:#fb7185}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#07101d,#0d1b2d);color:var(--text);font-family:Inter,system-ui,sans-serif}header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);background:#08111feb}.brand{display:flex;align-items:center;gap:12px}.mark{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:#0ea5e9;box-shadow:0 8px 24px #0284c755}.brand h1{font-size:16px;margin:0}.brand p{font-size:11px;color:var(--muted);margin:3px 0 0}.status{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--amber)}.dot.connected{background:var(--green);box-shadow:0 0 14px var(--green)}.dot.error{background:var(--red)}main{max-width:1500px;margin:auto;padding:20px 24px}.toolbar{display:grid;grid-template-columns:1.4fr 1.2fr auto;gap:10px;align-items:end;margin-bottom:16px}label{color:var(--muted);font-size:11px}input{width:100%;height:40px;margin-top:6px;border:1px solid var(--line);border-radius:9px;background:#091425;color:white;padding:0 11px;font-family:monospace;font-size:12px}button{height:40px;border:0;border-radius:9px;background:#0284c7;color:white;padding:0 16px;font-weight:700;cursor:pointer}.secondary{background:#1d2b40;border:1px solid var(--line)}.layout{display:grid;grid-template-columns:minmax(280px,.75fr) minmax(480px,1.25fr);gap:16px}.panel{border:1px solid var(--line);border-radius:14px;background:#101c2ee8;overflow:hidden}.head{height:46px;padding:0 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.head h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em}.diagram{min-height:500px;display:grid;place-items:center;padding:24px;background-image:linear-gradient(#17304a66 1px,transparent 1px),linear-gradient(90deg,#17304a66 1px,transparent 1px);background-size:28px 28px}.reactor{width:min(330px,82%);text-align:center}.reactor svg{width:100%;filter:drop-shadow(0 20px 25px #020617aa)}.list{max-height:500px;overflow:auto}.equipment{display:grid;grid-template-columns:1fr auto;gap:14px;padding:14px;border-bottom:1px solid var(--line);cursor:pointer}.equipment:last-child{border-bottom:0}.equipment-name{font-weight:700;font-size:14px}.time{margin-top:4px;color:var(--muted);font-size:10px;font-family:monospace}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{border:1px solid var(--line);border-radius:9px;padding:10px;background:#091425}.metric span{display:block;color:var(--muted);font-size:10px}.metric strong{display:block;margin-top:5px;font-family:monospace;font-size:16px}.pump{text-align:right;margin-top:8px}.badge{display:inline-block;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:700;background:#1e293b;color:#cbd5e1}.badge.on{background:#064e3b;color:#6ee7b7}.badge.off{background:#334155}.badge.alert{background:#4c1d32;color:#fecdd3}.empty{height:180px;display:grid;place-items:center;color:var(--muted);text-align:center;font-size:12px;padding:24px}.log{margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#091425;color:var(--muted);font:11px monospace;min-height:44px}@media(max-width:900px){.layout{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.diagram{min-height:420px}}
</style>
</head>
<body>
<header><div class="brand"><div class="mark">⚗</div><div><h1>SCADA NATS</h1><p>Taller OT · Telemetría en tiempo real</p></div></div><div class="status"><span id="statusDot" class="dot"></span><span id="statusText">Sin conectar</span></div></header>
<main>
<section class="toolbar"><label>Servidor NATS WebSocket<input id="serverInput" value="wss://demo.nats.io:443"></label><label>Subject<input id="subjectInput" value="planta.&gt;"></label><div style="display:flex;gap:8px"><button id="connectBtn">Conectar</button><button id="disconnectBtn" class="secondary">Detener</button></div></section>
<section class="layout">
<div class="panel"><div class="head"><h2>Proceso visual</h2><span id="selectedName" class="badge">Esperando datos</span></div><div class="diagram"><div class="reactor">
<svg viewBox="0 0 330 360" aria-label="Reactor industrial">
<defs><linearGradient id="steel"><stop stop-color="#94a3b8"/><stop offset=".5" stop-color="#f8fafc"/><stop offset="1" stop-color="#64748b"/></linearGradient><linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#0284c7"/></linearGradient></defs>
<ellipse cx="165" cy="318" rx="112" ry="18" fill="#020617" opacity=".7"/><g>
<rect x="72" y="58" width="186" height="250" rx="28" fill="url(#steel)" stroke="#cbd5e1" stroke-width="3"/><rect x="82" y="68" width="166" height="230" rx="21" fill="#12324b" stroke="#0f172a" stroke-width="4"/><clipPath id="tankClip"><rect x="82" y="68" width="166" height="230" rx="21"/></clipPath>
<g clip-path="url(#tankClip)"><rect id="liquidRect" x="82" y="160" width="166" height="138" fill="url(#water)" opacity=".92"/><path d="M82 160 Q123 151 165 160 T248 160" fill="none" stroke="#d5faff" stroke-width="4"/></g>
<rect x="125" y="32" width="80" height="30" rx="8" fill="#475569"/><rect x="145" y="18" width="40" height="18" rx="5" fill="#334155"/><circle cx="165" cy="170" r="35" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/><path d="M165 145v50M140 170h50M147 152l36 36M183 152l-36 36" stroke="#38bdf8" stroke-width="5"/><circle cx="165" cy="170" r="8" fill="#e2e8f0"/><rect x="89" y="308" width="152" height="12" rx="5" fill="#334155"/><rect x="105" y="300" width="20" height="28" rx="3" fill="#475569"/><rect x="205" y="300" width="20" height="28" rx="3" fill="#475569"/></g><path d="M258 262h34v25h38" fill="none" stroke="#38bdf8" stroke-width="9"/><rect x="292" y="278" width="22" height="22" rx="5" fill="#0ea5e9"/><text x="165" y="348" text-anchor="middle" fill="#94a3b8" font-size="13">REACTOR DE PROCESO</text></svg>
<div id="diagramMetric" class="badge">Nivel -- % · Temp -- °C</div></div></div></div>
<div class="panel"><div class="head"><h2>Equipos recibidos</h2><span id="equipmentCount" class="badge">0 equipos</span></div><div id="equipmentList" class="list"><div class="empty"><div><strong>Sin telemetría</strong><br><br>Ejecute el emisor OT en otra terminal.</div></div></div></div>
</section><div id="log" class="log">Listo para conectar al servidor público demo.nats.io.</div>
</main>
<script type="module">
const serverInput=document.getElementById('serverInput'),subjectInput=document.getElementById('subjectInput'),statusDot=document.getElementById('statusDot'),statusText=document.getElementById('statusText'),equipmentList=document.getElementById('equipmentList'),equipmentCount=document.getElementById('equipmentCount'),log=document.getElementById('log'),liquidRect=document.getElementById('liquidRect'),selectedName=document.getElementById('selectedName'),diagramMetric=document.getElementById('diagramMetric');
let nc=null,sub=null,natsApi=null;const equipment=new Map();
function setStatus(label,state=''){statusText.textContent=label;statusDot.className='dot '+state}function writeLog(m){log.textContent='['+new Date().toLocaleTimeString()+'] '+m}function escapeHtml(v){const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML}
function renderEquipment(){const values=[...equipment.values()].sort((a,b)=>b.receivedAt-a.receivedAt);equipmentCount.textContent=values.length+' equipo'+(values.length===1?'':'s');if(!values.length)return;equipmentList.innerHTML=values.map(item=>{const temp=Number(item.temperatura_c),nivel=Number(item.nivel_pct),alert=(Number.isFinite(temp)&&temp>=98)||(Number.isFinite(nivel)&&nivel>=90);return `<article class="equipment" data-equipment="${escapeHtml(item.equipo)}"><div><div class="equipment-name">${escapeHtml(item.equipo)}</div><div class="time">Último dato · ${escapeHtml(item.timestamp||'--:--:--')}</div><div class="pump"><span class="badge ${item.bomba_activa?'on':'off'}">BOMBA ${item.bomba_activa?'ACTIVA':'DETENIDA'}</span></div></div><div class="metrics"><div class="metric"><span>Temperatura</span><strong style="color:${alert?'#fb7185':'#f8fafc'}">${Number.isFinite(temp)?temp.toFixed(1)+' °C':'--'}</strong></div><div class="metric"><span>Nivel</span><strong style="color:${nivel>=90?'#fbbf24':'#38bdf8'}">${Number.isFinite(nivel)?nivel.toFixed(1)+' %':'--'}</strong></div><div class="metric"><span>Estado</span><strong style="font-size:12px;color:${alert?'#fb7185':'#34d399'}">${alert?'ALERTA':'NORMAL'}</strong></div></div></article>`}).join('');values.forEach(item=>{const card=[...equipmentList.querySelectorAll('.equipment')].find(el=>el.dataset.equipment===item.equipo);if(card)card.onclick=()=>selectEquipment(item)});selectEquipment(values[0])}
function selectEquipment(item){selectedName.textContent=item.equipo;selectedName.className='badge '+(item.bomba_activa?'on':'');const nivel=Number(item.nivel_pct),temp=Number(item.temperatura_c),safe=Number.isFinite(nivel)?Math.max(0,Math.min(100,nivel)):0;liquidRect.setAttribute('y',String(298-safe*2.3));liquidRect.setAttribute('height',String(safe*2.3));liquidRect.setAttribute('fill',Number.isFinite(temp)&&temp>=98?'#f43f5e':'url(#water)');diagramMetric.textContent='Nivel '+safe.toFixed(1)+' % · Temp '+(Number.isFinite(temp)?temp.toFixed(1):'--')+' °C'}
async function connect(){await disconnect(false);setStatus('Conectando');writeLog('Conectando a '+serverInput.value+' · '+subjectInput.value);try{if(!natsApi)natsApi=await import('https://esm.sh/nats.ws@1.29.3');nc=await natsApi.connect({servers:[serverInput.value],name:'SCADA-NATS-Taller',timeout:8000});sub=nc.subscribe(subjectInput.value);setStatus('Conectado','connected');writeLog('Suscrito a '+subjectInput.value+'. Esperando mensajes JSON...');localStorage.setItem('nats-scada-config',JSON.stringify({server:serverInput.value,subject:subjectInput.value}));const codec=natsApi.StringCodec();(async()=>{for await(const msg of sub){try{const payload=JSON.parse(codec.decode(msg.data));payload.equipo=payload.equipo||'Equipo sin nombre';payload.receivedAt=Date.now();payload.bomba_activa=payload.bomba_activa===true||payload.bomba_activa==='true'||payload.bomba_activa===1;payload.temperatura_c=Number(payload.temperatura_c);payload.nivel_pct=Number(payload.nivel_pct);equipment.set(payload.equipo,payload);renderEquipment();writeLog('Recibido '+payload.equipo+': '+payload.temperatura_c+' °C · '+payload.nivel_pct+' % · bomba '+(payload.bomba_activa?'activa':'detenida'))}catch(e){writeLog('Mensaje inválido: '+e.message)}}})();nc.closed().then(()=>{nc=null;setStatus('Desconectado','error')})}catch(e){nc=null;setStatus('Error de conexión','error');writeLog('Error: '+e.message)}}
async function disconnect(show=true){if(sub)sub.unsubscribe();sub=null;if(nc)await nc.close();nc=null;if(show){setStatus('Detenido','error');writeLog('Suscripción detenida.')}}
document.getElementById('connectBtn').onclick=connect;document.getElementById('disconnectBtn').onclick=()=>disconnect(true);try{const saved=JSON.parse(localStorage.getItem('nats-scada-config')||'null');if(saved?.server)serverInput.value=saved.server;if(saved?.subject)subjectInput.value=saved.subject}catch(e){}
</script>
</body>
</html>
