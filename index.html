<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCADA NATS - Taller OT</title>
<style>
:root{--bg:#07111f;--panel:#101c2e;--line:#263852;--text:#edf5ff;--muted:#95a8c0;--cyan:#38bdf8;--green:#34d399;--amber:#fbbf24;--red:#fb7185}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#07101d,#0d1b2d);color:var(--text);font-family:Inter,system-ui,sans-serif}
header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);background:#08111feb}.brand{display:flex;align-items:center;gap:12px}.mark{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:#0ea5e9;box-shadow:0 8px 24px #0284c755}.brand h1{font-size:16px;margin:0}.brand p{font-size:11px;color:var(--muted);margin:3px 0 0}.status{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--amber)}.dot.connected{background:var(--green);box-shadow:0 0 14px var(--green)}.dot.error{background:var(--red)}
main{max-width:1500px;margin:auto;padding:20px 24px}.toolbar{display:grid;grid-template-columns:1.4fr 1.2fr auto;gap:10px;align-items:end;margin-bottom:16px}label{color:var(--muted);font-size:11px}input{width:100%;height:40px;margin-top:6px;border:1px solid var(--line);border-radius:9px;background:#091425;color:white;padding:0 11px;font-family:monospace;font-size:12px}button{height:40px;border:0;border-radius:9px;background:#0284c7;color:white;padding:0 16px;font-weight:700;cursor:pointer}.secondary{background:#1d2b40;border:1px solid var(--line)}
.layout{display:grid;grid-template-columns:minmax(280px,.75fr) minmax(480px,1.25fr);gap:16px}.panel{border:1px solid var(--line);border-radius:14px;background:#101c2ee8;overflow:hidden}.head{height:46px;padding:0 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.head h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.diagram{position:relative;min-height:500px;display:grid;place-items:center;padding:24px;background-image:linear-gradient(#17304a66 1px,transparent 1px),linear-gradient(90deg,#17304a66 1px,transparent 1px);background-size:28px 28px}.reactor{width:min(390px,88%);text-align:center}.reactor svg{width:100%;filter:drop-shadow(0 20px 25px #020617aa);cursor:pointer}
.list{max-height:500px;overflow:auto}.equipment{display:grid;grid-template-columns:1fr auto;gap:14px;padding:14px;border-bottom:1px solid var(--line);cursor:pointer;transition:.18s}.equipment:hover,.equipment.selected{background:#172840}.equipment:last-child{border-bottom:0}.equipment-name{font-weight:700;font-size:14px}.time{margin-top:4px;color:var(--muted);font-size:10px;font-family:monospace}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{border:1px solid var(--line);border-radius:9px;padding:10px;background:#091425}.metric span{display:block;color:var(--muted);font-size:10px}.metric strong{display:block;margin-top:5px;font-family:monospace;font-size:16px}.pump{text-align:right;margin-top:8px}
.badge{display:inline-block;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:700;background:#1e293b;color:#cbd5e1}.badge.on{background:#064e3b;color:#6ee7b7}.badge.off{background:#334155}.badge.alert{background:#4c1d32;color:#fecdd3}.empty{height:180px;display:grid;place-items:center;color:var(--muted);text-align:center;font-size:12px;padding:24px}.log{margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#091425;color:var(--muted);font:11px monospace;min-height:44px}
#pumpAssembly{cursor:pointer}.pumpActive{animation:pumpPulse 1s ease-in-out infinite}@keyframes pumpPulse{50%{filter:drop-shadow(0 0 12px #34d399)}}.equipment-popover{position:absolute;z-index:20;display:none;min-width:210px;padding:12px;border:1px solid #38bdf8;border-radius:10px;background:#07111fef;box-shadow:0 14px 30px #020617cc;pointer-events:none;text-align:left}.equipment-popover.visible{display:block}.equipment-popover strong{display:block;margin-bottom:6px;color:#fff}.equipment-popover span{display:block;color:#b8c7da;font-size:11px;margin-top:3px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.diagram{min-height:420px}.equipment{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="brand"><div class="mark">⚗</div><div><h1>SCADA NATS</h1><p>Taller OT · Telemetría en tiempo real</p></div></div><div class="status"><span id="statusDot" class="dot"></span><span id="statusText">Sin conectar</span></div></header>
<main>
<section class="toolbar"><label>Servidor NATS WebSocket<input id="serverInput" value="wss://demo.nats.io:8443"></label><label>Subject<input id="subjectInput" value="planta.&gt;"></label><div style="display:flex;gap:8px"><button id="connectBtn">Conectar</button><button id="disconnectBtn" class="secondary">Detener</button></div></section>
<section class="layout">
<div class="panel"><div class="head"><h2>Proceso visual</h2><span id="selectedName" class="badge">Esperando datos</span></div><div class="diagram" id="diagramArea"><div class="reactor">
<svg id="reactorSvg" viewBox="0 0 330 360" aria-label="Reactor industrial con bomba">
<defs><linearGradient id="steel"><stop stop-color="#94a3b8"/><stop offset=".5" stop-color="#f8fafc"/><stop offset="1" stop-color="#64748b"/></linearGradient><linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#0284c7"/></linearGradient><linearGradient id="pumpMetal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e2e8f0"/><stop offset=".45" stop-color="#64748b"/><stop offset="1" stop-color="#1e293b"/></linearGradient></defs>
<ellipse cx="165" cy="318" rx="112" ry="18" fill="#020617" opacity=".7"/><g>
<rect x="72" y="58" width="186" height="250" rx="28" fill="url(#steel)" stroke="#cbd5e1" stroke-width="3"/><rect x="82" y="68" width="166" height="230" rx="21" fill="#12324b" stroke="#0f172a" stroke-width="4"/><clipPath id="tankClip"><rect x="82" y="68" width="166" height="230" rx="21"/></clipPath>
<g clip-path="url(#tankClip)"><rect id="liquidRect" x="82" y="160" width="166" height="138" fill="url(#water)" opacity=".92"/><path d="M82 160 Q123 151 165 160 T248 160" fill="none" stroke="#d5faff" stroke-width="4"/></g>
<rect x="125" y="32" width="80" height="30" rx="8" fill="#475569"/><rect x="145" y="18" width="40" height="18" rx="5" fill="#334155"/><circle cx="165" cy="170" r="35" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/><path d="M165 145v50M140 170h50M147 152l36 36M183 152l-36 36" stroke="#38bdf8" stroke-width="5"/><circle cx="165" cy="170" r="8" fill="#e2e8f0"/><rect x="89" y="308" width="152" height="12" rx="5" fill="#334155"/><rect x="105" y="300" width="20" height="28" rx="3" fill="#475569"/><rect x="205" y="300" width="20" height="28" rx="3" fill="#475569"/></g>
<g id="pumpAssembly"><path d="M258 262h34v25h38" fill="none" stroke="#38bdf8" stroke-width="9"/><rect x="292" y="278" width="22" height="22" rx="5" fill="#0ea5e9"/><ellipse cx="286" cy="292" rx="28" ry="10" fill="#020617" opacity=".75"/><rect x="265" y="260" width="44" height="44" rx="12" fill="url(#pumpMetal)" stroke="#cbd5e1" stroke-width="2"/><circle cx="287" cy="282" r="17" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/><circle cx="287" cy="282" r="6" fill="#e2e8f0"/><path id="pumpRotor" d="M287 266v32M271 282h32M277 272l20 20M297 272l-20 20" stroke="#38bdf8" stroke-width="4"/><rect x="273" y="302" width="28" height="10" rx="4" fill="#334155"/><circle id="pumpStatus" cx="287" cy="250" r="7" fill="#64748b"/><text x="287" y="324" text-anchor="middle" fill="#94a3b8" font-size="10">BOMBA</text></g>
<text x="165" y="348" text-anchor="middle" fill="#94a3b8" font-size="13">REACTOR DE PROCESO</text></svg>
<div id="equipmentPopover" class="equipment-popover"></div><div id="diagramMetric" class="badge">Nivel -- % · Temp -- °C</div></div></div></div>
<div class="panel"><div class="head"><h2>Equipos recibidos</h2><span id="equipmentCount" class="badge">0 equipos</span></div><div id="equipmentList" class="list"><div class="empty"><div><strong>Sin telemetría</strong><br><br>Ejecute el emisor OT en otra terminal.</div></div></div></div>
</section><div id="log" class="log">Listo para conectar al servidor público demo.nats.io.</div>
</main>
<script type="module">
const serverInput=document.getElementById('serverInput'),subjectInput=document.getElementById('subjectInput'),statusDot=document.getElementById('statusDot'),statusText=document.getElementById('statusText'),equipmentList=document.getElementById('equipmentList'),equipmentCount=document.getElementById('equipmentCount'),log=document.getElementById('log'),liquidRect=document.getElementById('liquidRect'),selectedName=document.getElementById('selectedName'),diagramMetric=document.getElementById('diagramMetric'),pumpAssembly=document.getElementById('pumpAssembly'),pumpStatus=document.getElementById('pumpStatus'),pumpRotor=document.getElementById('pumpRotor'),equipmentPopover=document.getElementById('equipmentPopover'),diagramArea=document.getElementById('diagramArea'),reactorSvg=document.getElementById('reactorSvg');
let nc=null,sub=null,natsApi=null;const equipment=new Map();let selectedEquipment=null;
function setStatus(label,state=''){statusText.textContent=label;statusDot.className='dot '+state}function writeLog(m){log.textContent='['+new Date().toLocaleTimeString()+'] '+m}function escapeHtml(v){const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML}
function renderEquipment(){
 const values=[...equipment.values()].sort((a,b)=>String(a.equipo).localeCompare(String(b.equipo),'es',{sensitivity:'base',numeric:true}));
 equipmentCount.textContent=values.length+' equipo'+(values.length===1?'':'s');
 if(!values.length){equipmentList.innerHTML='<div class="empty"><div><strong>Sin telemetría</strong><br><br>Ejecute el emisor OT en otra terminal.</div></div>';return}
 equipmentList.innerHTML=values.map(item=>`<article class="equipment ${selectedEquipment?.equipo===item.equipo?'selected':''}" data-equipment="${escapeHtml(item.equipo)}"><div><div class="equipment-name">${escapeHtml(item.equipo)}</div><div class="time">Toca el reactor o la bomba para ver datos</div></div><div class="pump"><span class="badge ${item.bomba_activa?'on':'off'}">${item.bomba_activa?'ACTIVA':'DETENIDA'}</span></div></article>`).join('');
 values.forEach(item=>{const card=[...equipmentList.querySelectorAll('.equipment')].find(el=>el.dataset.equipment===item.equipo);if(card)card.onclick=()=>selectEquipment(item)});
 if(!selectedEquipment||!equipment.has(selectedEquipment.equipo))selectedEquipment=values[0];
 selectEquipment(selectedEquipment,false);
}
function showPumpInfo(item){const temp=Number(item.temperatura_c),nivel=Number(item.nivel_pct);equipmentPopover.innerHTML=`<strong>${escapeHtml(item.equipo)}</strong><span>Bomba: ${item.bomba_activa?'Activa':'Detenida'}</span><span>Nivel: ${Number.isFinite(nivel)?nivel.toFixed(1)+' %':'--'}</span><span>Temperatura: ${Number.isFinite(temp)?temp.toFixed(1)+' °C':'--'}</span>`;equipmentPopover.classList.add('visible');const areaRect=diagramArea.getBoundingClientRect(),pumpRect=pumpAssembly.getBoundingClientRect();equipmentPopover.style.left=Math.min(areaRect.width-220,Math.max(8,pumpRect.right-areaRect.left-110))+'px';equipmentPopover.style.top=Math.max(8,pumpRect.top-areaRect.top-30)+'px'}
function hidePumpInfo(){equipmentPopover.classList.remove('visible')}
function selectEquipment(item,rerender=true){selectedEquipment=item;selectedName.textContent=item.equipo;selectedName.className='badge '+(item.bomba_activa?'on':'');const nivel=Number(item.nivel_pct),temp=Number(item.temperatura_c),safe=Number.isFinite(nivel)?Math.max(0,Math.min(100,nivel)):0;liquidRect.setAttribute('y',String(298-safe*2.3));liquidRect.setAttribute('height',String(safe*2.3));liquidRect.setAttribute('fill',Number.isFinite(temp)&&temp>=98?'#f43f5e':'url(#water)');diagramMetric.textContent='Nivel '+safe.toFixed(1)+' % · Temp '+(Number.isFinite(temp)?temp.toFixed(1):'--')+' °C';pumpStatus.setAttribute('fill',item.bomba_activa?'#34d399':'#64748b');pumpRotor.classList.toggle('pumpActive',item.bomba_activa);hidePumpInfo();if(rerender)renderEquipment()}
pumpAssembly.onclick=e=>{e.stopPropagation();if(selectedEquipment)showPumpInfo(selectedEquipment)};
pumpAssembly.onmouseleave=()=>{if(matchMedia('(hover: hover)').matches)hidePumpInfo()};
reactorSvg.onclick=e=>{if(!pumpAssembly.contains(e.target)&&selectedEquipment)showPumpInfo(selectedEquipment)};
diagramArea.onclick=e=>{if(!pumpAssembly.contains(e.target)&&e.target!==equipmentPopover&&!reactorSvg.contains(e.target))hidePumpInfo()};
async function connect(){await disconnect(false);setStatus('Conectando');writeLog('Conectando a '+serverInput.value+' · '+subjectInput.value);try{if(!natsApi){const modules=['https://esm.sh/nats.ws@1.30.3','https://cdn.jsdelivr.net/npm/nats.ws@1.30.3/esm/nats.js'];let loadError=null;for(const url of modules){try{natsApi=await import(url);break}catch(error){loadError=error}}if(!natsApi)throw new Error('No se pudo cargar el cliente NATS desde los CDN disponibles: '+(loadError?.message||'error desconocido'))}nc=await natsApi.connect({servers:[serverInput.value],name:'SCADA-NATS-Taller',timeout:8000});sub=nc.subscribe(subjectInput.value);setStatus('Conectado','connected');writeLog('Suscrito a '+subjectInput.value+'. Esperando mensajes JSON...');localStorage.setItem('nats-scada-config',JSON.stringify({server:serverInput.value,subject:subjectInput.value}));const codec=natsApi.StringCodec();(async()=>{for await(const msg of sub){try{const payload=JSON.parse(codec.decode(msg.data));payload.equipo=payload.equipo||'Equipo sin nombre';payload.receivedAt=Date.now();payload.bomba_activa=payload.bomba_activa===true||payload.bomba_activa==='true'||payload.bomba_activa===1;payload.temperatura_c=Number(payload.temperatura_c);payload.nivel_pct=Number(payload.nivel_pct);equipment.set(payload.equipo,payload);renderEquipment();writeLog('Recibido '+payload.equipo+': '+payload.temperatura_c+' °C · '+payload.nivel_pct+' % · bomba '+(payload.bomba_activa?'activa':'detenida'))}catch(e){writeLog('Mensaje inválido: '+e.message)}}})();nc.closed().then(()=>{nc=null;setStatus('Desconectado','error')})}catch(e){nc=null;setStatus('Error de conexión','error');writeLog('Error: '+e.message)}}
async function disconnect(show=true){if(sub)sub.unsubscribe();sub=null;if(nc)await nc.close();nc=null;if(show){setStatus('Detenido','error');writeLog('Suscripción detenida.')}}
document.getElementById('connectBtn').onclick=connect;document.getElementById('disconnectBtn').onclick=()=>disconnect(true);try{const saved=JSON.parse(localStorage.getItem('nats-scada-config')||'null');if(saved?.server)serverInput.value=saved.server==='wss://demo.nats.io:443'?'wss://demo.nats.io:8443':saved.server;if(saved?.subject)subjectInput.value=saved.subject}catch(e){}
</script>
</body>
</html>
